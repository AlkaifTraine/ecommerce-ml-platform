[project]
name = "ecommerce-ml-platform"
version = "0.1.0"
description = "Continuously-retraining purchase-intent platform on a real e-commerce clickstream"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# puts the repo root on sys.path so `from src...` resolves without an install
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
