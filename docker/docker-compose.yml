# Local platform stack for the e-commerce purchase-intent project.
#
# NAMING: every container this project owns is prefixed `ecomml-`, so it is
# unambiguous which containers belong here versus to anything else running on
# the machine. Volumes and the network are prefixed `ecomml_` via the project
# name below.
#
#   docker compose up -d                      # ecomml-postgres + ecomml-redis
#   docker compose --profile airflow up -d    # + ecomml-airflow (orchestration)
#   docker compose --profile tools   up -d    # + ecomml-adminer (DB browser)
#   docker compose --profile kafka   up -d    # + ecomml-kafka (swaps Redis Streams)
#
# See what belongs to this project at any time:
#   docker ps --filter "name=ecomml-"
#
# Postgres is on 5433 to avoid colliding with any other local install.

name: ecommerce-ml-platform

services:
  postgres:
    # postgres:16 (not -alpine) because that tag is already present locally and
    # this machine has ~100 KB/s of bandwidth; pulling a new image costs an hour.
    image: postgres:16
    container_name: ecomml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-storefront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storefront_local}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    # Tuned for a write-heavy replay on a 16GB laptop. synchronous_commit=off
    # trades crash durability for throughput, which is the right call here: the
    # archive is the source of truth and a replay can simply be re-run.
    command: >
      postgres
      -c shared_buffers=384MB
      -c work_mem=24MB
      -c maintenance_work_mem=192MB
      -c max_connections=60
      -c synchronous_commit=off
      -c wal_compression=on
      -c checkpoint_timeout=15min
      -c max_wal_size=2GB
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storefront} -d ${POSTGRES_DB:-storefront}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:latest
    container_name: ecomml-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Event bus + online feature store. maxmemory caps the stream so a long
    # replay cannot consume the host; allkeys-lru evicts cold feature keys.
    command: >
      redis-server
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: ecomml-airflow:2.10.0
    container_name: ecomml-airflow
    restart: unless-stopped
    profiles: ["airflow"]
    ports:
      - "8080:8080"
    environment:
      # LocalExecutor in ONE container rather than the usual webserver +
      # scheduler + triggerer + its own Postgres. That standard topology wants
      # ~2.5GB; this machine has ~4GB free with everything else stopped.
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-storefront}:${POSTGRES_PASSWORD:-storefront_local}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: local_dev_not_a_secret
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # The pipeline reads its paths from these, same as on the host.
      DATA_ROOT: /opt/project/data
      DUCKDB_TEMP_DIR: /opt/project/data/.duckdb_tmp
      DUCKDB_MEMORY_LIMIT: 2GB
      # All four are required. .env is NOT mounted into this container, so
      # anything omitted here silently falls back to the placeholder defaults
      # in config.py - which is how the first DAG run failed with
      # "password authentication failed for user storefront".
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-storefront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storefront_local}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /opt/project
      # dbt's profile reads this; the host path in profiles.yml is a Windows
      # path that does not exist inside the container.
      WAREHOUSE_PATH: /opt/project/data/warehouse.duckdb
      MLFLOW_TRACKING_URI: ""
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/project/src
      - ../scripts:/opt/project/scripts
      - ../data:/opt/project/data
      # required by warehouse_refresh, which runs `dbt build` from here
      - ../dbt:/opt/project/dbt
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin
                 --firstname a --lastname b --role Admin --email admin@example.com || true &&
               airflow scheduler & exec airflow webserver"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:4-standalone
    container_name: ecomml-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: bitnami/kafka:3.9
    container_name: ecomml-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      # KRaft mode - no ZooKeeper, single combined broker/controller node
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "6"
      KAFKA_CFG_LOG_RETENTION_HOURS: "24"
    volumes:
      - kafkadata:/bitnami/kafka

volumes:
  pgdata:
  redisdata:
  airflow_logs:
  kafkadata:
